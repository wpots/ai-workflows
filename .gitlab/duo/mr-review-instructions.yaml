# Group-level review instructions for GitLab Duo Code Review in greenberrynl.
# The group points at this project as its template (Settings > GitLab Duo >
# Change configuration > Customize code review), so every project in the group
# gets these on top of its own .gitlab/duo/mr-review-instructions.yaml.
# The policy lives in rules/; each entry carries the review-critical points and
# links the full rule, which Duo reads only as a summary, best effort.

instructions:
  - name: How to review
    instructions: |
      1. Report only findings a reviewer would act on. Skip formatting and
         anything ESLint, Prettier or the type-checker already enforce.
      2. Every finding names the file and line, why it is a problem (the
         failure mode or the trust boundary), and the fix.
      3. Order findings by severity: correctness and security first, then
         architecture and type safety, then the rest.
      4. One comment per issue. When the same issue repeats, comment once and
         list the other locations.
      5. When the project's own review instructions conflict with these, the
         project's instructions win.
      6. A violation that the diff did not introduce, in neighbouring code, is
         a suggested follow-up, never a blocking finding. New code follows the
         rule even when its neighbour does not.
      7. Flag speculative hardening: a fallback, retry, extra header or second
         lookup path for a failure the change never demonstrates, with no test
         that fails without it. Ask what evidence exists. Validating untrusted
         input at a boundary is not speculative.
         Rule: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/rules/project.md

  - name: Correctness and security
    fileFilters:
      - "**/*.{ts,tsx,js,jsx,mjs,cjs}"
    instructions: |
      1. Functional bugs, regressions and broken edge cases: empty, error,
         unauthorised and loading states.
      2. Injection, missing authentication or authorisation checks, secrets in
         code or logs, unsafe redirects and unvalidated uploads.
      3. A Server Action or route handler that changes data without checking
         who is calling it.
      4. Errors swallowed silently: a catch or callback that ignores its error.

  - name: Type safety and trust boundaries
    fileFilters:
      - "**/*.{ts,tsx}"
      - "!**/*.test.{ts,tsx}"
      - "!**/*.stories.tsx"
    instructions: |
      1. Data from APIs, fetch responses, JSON.parse, environment variables,
         database or CMS rows, files, queues and webhooks is untrusted until it
         is validated (Zod or a type guard) at the edge and mapped into a
         domain type.
      2. Flag `any`, and `as` assertions that hide uncertainty, such as
         `(await res.json()) as T`, `JSON.parse(raw) as T` or
         `process.env.X as string`.
      3. Flag raw transport or CMS types passed into UI or domain code without
         a transform, unsafe indexing on uncertain values, and non-exhaustive
         unions or switches.
         Rule: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/rules/type-safety.md

  - name: Architecture
    fileFilters:
      - "src/**/*.{ts,tsx}"
    instructions: |
      1. Dependencies point inward: presentation never imports infrastructure
         directly, infrastructure never imports presentation, and domain code
         imports no framework.
         Rule: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/rules/clean-architecture.md
      2. In a Next.js App Router project, a page.tsx holds only route control
         flow and the Template element. Fetching and view-model derivation go
         in templates/<Name>/load<Name>.ts, and raw-to-props mapping in a
         Transform*.ts the loader calls.
      3. Flag fetch() inline in a page, layout or component, Payload queries
         outside the infrastructure layer, business logic in component files,
         and "use server" functions defined inside component files.
      4. A new file under utils/, lib/, constants/, hooks/ or actions/ needs at
         least two unrelated consumers. A single-consumer helper belongs in the
         feature's module folder.
         Rule: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/rules/stacks/nextjs-payload.md

  - name: Accessibility
    fileFilters:
      - "**/*.tsx"
      - "!**/*.test.tsx"
    instructions: |
      1. Semantic HTML and native elements first. A custom interactive element
         needs the right role, state and keyboard behaviour.
      2. Icon-only buttons and ambiguous controls need an accessible name.
         Form fields need a linked label; errors and helper text are connected
         with aria-describedby.
      3. Focus stays visible, and moves and returns correctly when UI opens or
         closes. Dynamic status changes without a focus move are announced in a
         live region.
      4. Images need alt text (alt="" when decorative). Headings do not skip
         levels. Colour is never the only signal. Motion respects
         prefers-reduced-motion.
         Rule: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/rules/accessibility.md

  - name: Performance and sustainability
    fileFilters:
      - "src/**/*.{ts,tsx}"
      - ".gitlab-ci.yml"
    instructions: |
      1. A new "use client" on a component without an event handler, hook or
         browser API.
      2. A new unconditional draftMode(), headers(), cookies() or searchParams
         in a public route or shared layout, which makes the whole route
         dynamic.
      3. The same query run twice per request, and serial awaits over
         independent lookups where Promise.all would do.
      4. The LCP image lazy-loaded, a raw <img> instead of the framework image
         component, and a heavy library shipped to visitors who cannot reach
         the feature.
      5. In CI, a job that runs on every commit regardless of changed paths, or
         without a dependency cache.
         Rule: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/rules/sustainability.md

  - name: Styling
    fileFilters:
      - "**/*.{tsx,css}"
    instructions: |
      1. Only design tokens: no raw Tailwind colours (bg-blue-600), no
         arbitrary values ([#fff], [20px]), no inline style objects.
      2. Repeated patterns become a component, not @apply.
         Rule: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/rules/tailwind.md

  - name: Tests
    fileFilters:
      - "**/*.{ts,tsx}"
    instructions: |
      1. Changed behaviour without a changed or added test is a finding.
      2. Tests check user-visible behaviour, not implementation details. They
         query by role or label before test ids, and mock sparingly.
      3. A coverage floor is never lowered to make a change pass, and an
         istanbul ignore states its reason on the same line.
         Rule: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/rules/testing.md

  - name: Comments and documentation
    instructions: |
      1. A comment or doc that the diff made untrue is a finding: a renamed or
         removed function still named, a changed default still documented,
         JSDoc that no longer matches the signature.
      2. Recommend deleting an added comment that restates the code next to
         it, argues to the reviewer why the change is right, narrates the
         design in a file header, or points at an MR or ticket number. Its
         content belongs in the MR description.
      3. Do not comment on the style or amount of existing comments.
         Rule: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/rules/documentation.md

  - name: Payload migrations
    fileFilters:
      - "**/migrations/**/*.{ts,json}"
    instructions: |
      1. A migration contains only statements for this change. Flag a CREATE
         for an object that an earlier migration already creates, and
         statements that belong to another feature.
      2. A migration's snapshot must not regress tables or columns that
         migrations already on the base branch added.
         Checks: https://gitlab.com/greenberrynl/config/ai-workflows/-/blob/main/skills/migration-check/SKILL.md
